<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE CELL — Online Exhibition</title>
  <meta name="description" content="THE CELL — 큐브 하나가 하나의 전시가 되는 온라인 인터랙티브 전시 플랫폼" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css?v=7" />
  <script type="importmap">
    { "imports": { "three": "./js/vendor/three.module.js" } }
  </script>
</head>
<body class="home">
  <header class="topbar">
    <a class="logo" href="./"><span class="logo-cube"></span>THE CELL</a>
    <nav>
      <button id="btn-index" class="nav-btn" aria-expanded="false">INDEX</button>
      <button id="btn-about" class="nav-btn">ABOUT</button>
    </nav>
  </header>

  <canvas id="stage" aria-label="큐브 그리드: 각 큐브를 눌러 전시에 들어갑니다"></canvas>

  <div class="hero-copy">
    <p class="eyebrow">ONLINE INTERACTIVE EXHIBITION</p>
    <h1>THE CELL</h1>
    <p class="lede">큐브 하나, 하나의 전시.<br />셀을 골라 안으로 들어가세요.</p>
  </div>

  <aside id="hover-card" class="hover-card" aria-hidden="true">
    <span class="hc-no"></span>
    <strong class="hc-title"></strong>
    <span class="hc-sub"></span>
    <span class="hc-meta"></span>
  </aside>

  <div class="hint">드래그해서 둘러보기 · 큐브를 클릭해 입장</div>

  <section id="index-panel" class="panel" hidden>
    <div class="panel-inner">
      <h2>INDEX</h2>
      <ol id="cell-list" class="cell-list"></ol>
    </div>
  </section>

  <section id="about-panel" class="panel" hidden>
    <div class="panel-inner about">
      <h2>ABOUT</h2>
      <p>THE CELL은 하나의 큐브(Cell)를 하나의 전시 단위로 다루는 온라인 전시 플랫폼입니다. 각 셀은 스크롤을 따라 펼쳐지는 인터랙티브 스토리로 구성됩니다.</p>
      <p class="small">Produced by VALIX LAB</p>
    </div>
  </section>

  <div id="loader" class="loader"><span></span></div>
  <div id="wipe" class="wipe"></div>
  <noscript><p style="padding:2rem">JavaScript가 필요합니다.</p></noscript>

  <script type="module" src="js/main.js?v=7"></script>
</body>
</html>
